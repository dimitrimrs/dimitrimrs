name: Generate Snake

on:
  schedule: # Gera automaticamente todos os dias às 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # Permite rodar manualmente
  push: # Opcional: gerar ao atualizar o repo
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: dimitrimrs
          outputs: dist/snake.svg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
